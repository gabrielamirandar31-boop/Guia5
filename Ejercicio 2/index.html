<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de pedidos - Cafetería</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="pedidos.js" defer></script>
  </head>

  <body class="bg-light">
    <div class="container py-4">
      <h1 class="text-center mb-4">Gestión de pedidos de la cafetería</h1>

      <form class="row g-3 mb-4">
        <div class="col-md-5">
          <label for="inputProducto" class="form-label">Producto</label>
          <input type="text" class="form-control" id="inputProducto" required />
        </div>
        <div class="col-md-3">
          <label for="inputPrecio" class="form-label">Precio unitario</label>
          <input type="number" class="form-control" id="inputPrecio" step="0.01" required />
        </div>
        <div class="col-md-2">
          <label for="inputCantidad" class="form-label">Cantidad</label>
          <input type="number" class="form-control" id="inputCantidad" required />
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <button type="button" id="btnAgregar" class="btn btn-primary w-100">Agregar pedido</button>
        </div>
      </form>

      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <label for="inputPrecioMax" class="form-label">Precio máximo</label>
          <input type="number" class="form-control" id="inputPrecioMax" step="0.01" />
        </div>
        <div class="col-md-8 d-flex align-items-end gap-2">
          <button type="button" id="btnFiltrar" class="btn btn-secondary">Filtrar productos</button>
          <button type="button" id="btnMostrarTodos" class="btn btn-outline-secondary">Mostrar todos</button>
          <button type="button" id="btnLimpiar" class="btn btn-danger">Limpiar pedidos</button>
        </div>
      </div>

      <table class="table table-striped">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Precio unitario</th>
            <th>Cantidad</th>
            <th>Subtotal</th>
          </tr>
        </thead>
        <tbody id="tbodyPedidos"></tbody>
      </table>

      <p><strong>Total de unidades:</strong> <span id="totalUnidades">0</span></p>
      <p><strong>Monto total:</strong> $<span id="montoTotal">0.00</span></p>
    </div>
  </body>
</html>
