<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de pedidos - Cafetería</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="/js/tablas.js" defer></script>
  </head>

  <body class="bg-light">
    <div class="container py-4">
      <h1 class="text-center mb-4">Gestión de pedidos de la cafetería</h1>

      <!-- Formulario de registro -->
      <div class="card shadow-sm mb-4">
        <div class="card-header fw-bold">Nuevo pedido</div>
        <div class="card-body">
          <form id="formPedido" novalidate>
            <div class="row g-3">
              <div class="col-md-5">
                <label for="inputProducto" class="form-label">Producto</label>
                <input
                  type="text"
                  class="form-control"
                  id="inputProducto"
                  placeholder="Ej. Café americano"
                  required
                />
              </div>
              <div class="col-md-3">
                <label for="inputPrecio" class="form-label">Precio unitario ($)</label>
                <input
                  type="number"
                  class="form-control"
                  id="inputPrecio"
                  placeholder="2.50"
                  step="0.01"
                  min="0"
                  required
                />
              </div>
              <div class="col-md-2">
                <label for="inputCantidad" class="form-label">Cantidad</label>
                <input
                  type="number"
                  class="form-control"
                  id="inputCantidad"
                  placeholder="3"
                  step="1"
                  min="1"
                  required
                />
              </div>
              <div class="col-md-2 d-flex align-items-end">
                <button type="button" id="btnAgregar" class="btn btn-primary w-100">
                  Agregar pedido
                </button>
              </div>
            </div>
          </form>
          <div id="mensajeError" class="alert alert-danger mt-3 d-none" role="alert"></div>
        </div>
      </div>

      <!-- Filtros y acciones -->
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <div class="row g-3 align-items-end">
            <div class="col-md-4">
              <label for="inputPrecioMax" class="form-label">Precio máximo ($)</label>
              <input
                type="number"
                class="form-control"
                id="inputPrecioMax"
                placeholder="Ej. 3.00"
                step="0.01"
                min="0"
              />
            </div>
            <div class="col-md-8 d-flex flex-wrap gap-2">
              <button type="button" id="btnFiltrar" class="btn
